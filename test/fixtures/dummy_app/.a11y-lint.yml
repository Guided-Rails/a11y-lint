# Class names that wrap content hidden from assistive technology.
# Content inside these wrappers does not count toward an element's accessible name.
inaccessible_wrapper_classes:
  - popover

# Class names that wrap content visible only to assistive technology.
# Content inside these wrappers counts toward an element's accessible name.
accessible_wrapper_classes:
  - sr-only
