# All rules enabled by default.
# Uncomment to disable a rule:
#
# ImgMissingAlt:
#   Enabled: false
#
# ImageTagMissingAlt:
#   Enabled: false
#
# LinkToMissingAccessibleName:
#   Enabled: false
#
# ButtonTagMissingAccessibleName:
#   Enabled: false

# Class names that wrap content hidden from assistive technology
# (e.g. via CSS `visibility: hidden`). Content inside these wrappers
# does not count toward an element's accessible name.
hidden_wrapper_classes:
  - popover

# Class names that wrap content visible only to assistive technology
# (e.g. CSS-clipped sr-only spans). Inside Phlex tags whose class
# matches, ambiguous bare calls (HTML-tag-named, no args, no block)
# are treated as auto-emitting text rather than empty HTML elements.
accessible_name_wrapper_classes:
  - sr-only
